services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sampletracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build: .
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=sampletracker;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    networks:
      - internal

networks:
  internal:

volumes:
  db-data:
